<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小红书长文出图</title>
<style>
:root {
  --ui-bg: #f3f1ec;
  --ui-panel: #fffcf7;
  --ui-line: #e2ddd3;
  --ui-ink: #1c2420;
  --ui-muted: #6a6963;
  --ui-accent: #34906C;
  --ui-accent-2: #173A52;
  --s: 0.38;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--ui-bg);
  color: var(--ui-ink);
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
header.appbar {
  flex-shrink: 0;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  background: var(--ui-panel);
  border-bottom: 1px solid var(--ui-line);
}
header h1 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.06em;
  margin: 0;
  white-space: nowrap;
}

.theme-switch.size-switch button { padding: 6px 10px; }
.size-switch-label { font-size: 11px; color: var(--ui-muted); letter-spacing: .08em; margin: 0 2px 0 8px; }
header.appbar { flex-wrap: wrap; height: auto; min-height: 58px; row-gap: 8px; padding-top: 8px; padding-bottom: 8px; }

.theme-switch { display: flex; background: var(--ui-bg); border-radius: 8px; padding: 3px; gap: 2px; }
.theme-switch button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 6px;
  font: inherit; font-size: 13px; cursor: pointer; color: var(--ui-muted);
}
.theme-switch button.on { background: #fff; color: var(--ui-ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.spacer { flex: 1; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button.btn, label.btn {
  border: 1px solid var(--ui-line); background: #fff; color: var(--ui-ink);
  padding: 7px 12px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
button.btn.primary { background: var(--ui-accent); color: #fff; border-color: var(--ui-accent); }
body.th-v1 button.btn.primary { background: var(--ui-accent-2); border-color: var(--ui-accent-2); }
button.btn:disabled { opacity: .55; cursor: default; }
#status { font-size: 12px; color: var(--ui-muted); margin-left: 8px; white-space: nowrap; }
.app {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(340px, 42%) 1fr;
  min-height: 0;
}
.left {
  border-right: 1px solid var(--ui-line);
  background: var(--ui-panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 16px 16px 12px;
  gap: 10px;
}
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.fields .full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--ui-muted); letter-spacing: .06em; }
label.f input, label.f textarea, #md {
  font: inherit; font-size: 14px; color: var(--ui-ink);
  border: 1px solid var(--ui-line); border-radius: 8px; padding: 8px 10px;
  background: #fff; width: 100%;
}
#md {
  flex: 1;
  min-height: 200px;
  resize: none;
  font-size: 13.5px;
  line-height: 1.6;
  font-family: "PingFang SC", "Hiragino Sans GB", ui-monospace, Menlo, monospace;
}
.left-hint { font-size: 11px; color: var(--ui-muted); }
.right {
  overflow: auto;
  padding: 24px 28px 40px;
  background:
    linear-gradient(#0000 0, #0000 0),
    var(--ui-bg);
}
.pv-stack { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
.pv-card { }
.pv-meta {
  display: flex; align-items: center; justify-content: space-between;
  width: calc(1080px * var(--s));
  margin-bottom: 8px;
  font-size: 12px; color: var(--ui-muted);
}
.pv-meta button { font-size: 12px; padding: 4px 9px; }
.pv-frame {
  width: calc(1080px * var(--s));
  height: calc(1440px * var(--s));
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(40, 40, 30, .12);
  background: #fff;
}
.pv-scale { transform: scale(var(--s)); transform-origin: top left; }
#deck { position: absolute; left: -24000px; top: 0; width: 1080px; }
.hidden-file { display: none; }
@media (max-width: 1100px) {
  :root { --s: 0.32; }
  .app { grid-template-columns: 36% 1fr; }
}

/* html2canvas 对行内 linear-gradient / box-decoration-break 会错位，改用下划线高亮 */
.hl {
  background: none !important;
  background-image: none !important;
  box-shadow: none !important;
  box-decoration-break: slice !important;
  -webkit-box-decoration-break: slice !important;
  border-bottom: 0.28em solid var(--gold-soft);
  padding: 0 0.04em;
  font-weight: 700;
  color: var(--ink-deep);
}
.cover-title .em {
  box-shadow: none !important;
  border-bottom: 10px solid var(--gold-em);
  padding-bottom: 0;
}


.theme-v1 {
  --paper: #F6F1E8; --ink: #173A52; --ink-deep: #102A3C; --ink-faint: rgba(23, 58, 82, 0.28);
  --text: #2C2A26; --muted: #6B6458; --gold: #B8903A; --gold-soft: #E8D29A;
  --gold-em: rgba(184, 144, 58, 0.35); --gold-faint: rgba(184, 144, 58, 0.11); --rule: #D4C8B0;
  --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif;
}
.theme-v2 {
  --paper: #F5F6F0; --ink: #34906C; --ink-deep: #1E5A43; --ink-faint: rgba(52, 144, 108, 0.30);
  --text: #2A2C29; --muted: #667066; --gold: #D4A54A; --gold-soft: #F2E2A0;
  --gold-em: rgba(212, 165, 74, 0.40); --gold-faint: rgba(242, 226, 160, 0.45); --rule: #D2D4C8;
  --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif;
}

.page {
  width: 1080px;
  height: 1440px;
  background: var(--paper);
  padding: var(--page-pad);
  overflow: hidden;
  position: relative;
}

.frame {
  width: calc(1080px - 2 * var(--page-pad));
  height: calc(1440px - 2 * var(--page-pad));
  border: 2.5px solid var(--ink);
  position: relative;
  display: flex;
  flex-direction: column;
  padding: var(--frame-pad-top) var(--frame-pad-x) var(--frame-pad-bot);
  overflow: hidden;
}

.frame::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid var(--ink-faint);
  pointer-events: none;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--sans);
  font-size: var(--topbar-size);
  color: var(--muted);
  letter-spacing: 0.12em;
  flex-shrink: 0;
}

.topbar .tag {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--ink);
  font-weight: 700;
  letter-spacing: 0.16em;
}

.topbar .tag::before {
  content: "";
  width: 28px;
  height: 3px;
  background: var(--gold);
  display: block;
}

.topbar .series {
  letter-spacing: 0.08em;
  font-weight: 400;
}

.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-top: var(--content-pad-top);
  min-height: 0;
}

.sec-kicker {
  font-family: var(--sans);
  font-size: var(--kicker-size);
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.18em;
  margin-bottom: var(--kicker-mb);
}

h1 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: var(--h1-size);
  line-height: 1.35;
  color: var(--ink-deep);
  letter-spacing: 0.04em;
}

.rule {
  width: var(--rule-w);
  height: 3px;
  background: var(--gold);
  margin: var(--rule-mt) 0 var(--rule-mb);
  flex-shrink: 0;
}

.prose {
  font-family: var(--sans);
  font-size: var(--body-size);
  line-height: var(--body-lh);
  color: var(--text);
  text-align: left;
}

.prose p {
  margin: 0 0 var(--p-mb);
}

.prose p:last-child {
  margin-bottom: 0;
}

.hl {
  font-weight: 700;
  color: var(--ink-deep);
  background: linear-gradient(transparent 58%, var(--gold-soft) 58%);
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  padding: 0 0.04em;
}

ol.points, ul.points {
  list-style: none;
  margin: var(--list-mt) 0 var(--list-mb);
  padding: 0;
}

ol.points li, ul.points li {
  position: relative;
  padding-left: var(--list-pad);
  margin: 0 0 var(--list-gap);
  font-family: var(--sans);
  font-size: var(--body-size);
  line-height: var(--body-lh);
  text-align: left;
}

ol.points li:last-child, ul.points li:last-child {
  margin-bottom: 0;
}

ol.points li .idx,
ul.points li .idx {
  position: absolute;
  left: 0;
  top: 10px;
  width: var(--idx-size);
  height: var(--idx-size);
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--sans);
  font-size: var(--idx-font);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0;
  line-height: 1;
}

ul.points li .idx {
  width: var(--idx-dot);
  height: var(--idx-dot);
  border-radius: 50%;
  top: 26px;
  left: 14px;
  background: var(--gold);
  font-size: 0;
}

.footer {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: var(--footer-pt);
  border-top: 1px solid var(--rule);
  font-family: var(--sans);
  font-size: var(--footer-size);
  color: var(--muted);
  letter-spacing: 0.08em;
}

.footer .pg {
  color: var(--ink);
  font-weight: 700;
  letter-spacing: 0.14em;
  flex-shrink: 0;
}

.footer-author { min-width: 0; }

.footer-dog {
  display: none;
  height: var(--footer-dog);
  width: auto;
  flex-shrink: 0;
  object-fit: contain;
}

.page.has-dog .footer-dog { display: block; }

.page.cover .frame { padding: var(--cover-frame-pad-top) var(--cover-frame-pad-x) var(--cover-frame-pad-bot); }
.page.cover .footer-dog { display: none; }

.cover-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.cover-badge {
  font-family: var(--sans);
  font-size: var(--badge-size);
  font-weight: 700;
  color: var(--paper);
  background: var(--ink);
  letter-spacing: 0.22em;
  padding: var(--badge-pad-y) var(--badge-pad-x) var(--badge-pad-y) calc(var(--badge-pad-x) + 4px);
}

.cover-vol {
  font-family: var(--sans);
  font-size: var(--cover-vol-size);
  color: var(--muted);
  letter-spacing: 0.2em;
}

.cover-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 20px;
  min-height: 0;
}

.cover-hero {
  display: flex;
  align-items: center;
  gap: 24px;
}

.cover-copy { flex: 1; min-width: 0; }

.cover-dog {
  display: none;
  width: var(--cover-dog-w);
  height: auto;
  flex-shrink: 0;
  object-fit: contain;
  pointer-events: none;
}

.page.has-dog .cover-dog { display: block; }
.page.has-dog.cover .cover-title { font-size: var(--cover-title-dog); letter-spacing: 0.04em; }

.cover-kicker {
  font-family: var(--sans);
  font-size: var(--cover-kicker-size);
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.28em;
  margin-bottom: var(--cover-kicker-mb);
}

.cover-title {
  font-family: var(--serif);
  font-weight: 700;
  font-size: var(--cover-title-size);
  line-height: 1.22;
  color: var(--ink-deep);
  letter-spacing: 0.06em;
}

.cover-title .em {
  color: var(--ink);
  position: relative;
  box-shadow: inset 0 -8px 0 var(--gold-em);
}

.cover-sub {
  margin-top: var(--cover-sub-mt);
  font-family: var(--serif);
  font-size: var(--cover-sub-size);
  line-height: 1.6;
  color: var(--muted);
  letter-spacing: 0.04em;
  font-weight: 400;
}

.cover-rule {
  width: var(--cover-rule-w);
  height: 3px;
  background: var(--gold);
  margin: var(--cover-rule-my) 0 36px;
  flex-shrink: 0;
}

.cover-lead {
  font-family: var(--sans);
  font-size: var(--cover-lead-size);
  line-height: var(--cover-lead-lh);
  color: var(--text);
  text-align: left;
}

.cover-bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-shrink: 0;
  padding-top: 20px;
}

.author {
  font-family: var(--serif);
  font-size: var(--author-size);
  color: var(--ink-deep);
  letter-spacing: 0.08em;
  line-height: 1.45;
}

.author .role {
  display: block;
  font-family: var(--sans);
  font-size: var(--role-size);
  color: var(--muted);
  letter-spacing: 0.14em;
  margin-top: 4px;
  font-weight: 400;
}

.cover-pg {
  font-family: var(--sans);
  font-size: var(--cover-pg-size);
  color: var(--ink);
  font-weight: 700;
  letter-spacing: 0.14em;
}

.end-mark {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: var(--end-mt);
  font-family: var(--serif);
  font-size: var(--end-size);
  color: var(--gold);
  letter-spacing: 0.4em;
}

.end-mark::before,
.end-mark::after {
  content: "";
  width: 36px;
  height: 1px;
  background: var(--gold);
}

.page.compact .content { padding-top: var(--compact-content-pt); }
.page.compact .rule { margin: 18px 0 24px; }
.page.compact .prose { line-height: var(--compact-lh); }
.page.compact ul.points,
.page.compact ol.points { margin: 2px 0 16px; }
.page.compact ul.points li,
.page.compact ol.points li { margin-bottom: 10px; line-height: var(--compact-lh); }
.page.compact .footer { padding-top: 14px; }

.pull {
  margin: 12px 0 8px;
  padding: var(--pull-pad-t) var(--pull-pad-x) var(--pull-pad-b);
  border-left: 5px solid var(--gold);
  background: var(--gold-faint);
  font-family: var(--serif);
  font-size: var(--pull-size);
  font-weight: 700;
  line-height: 1.7;
  color: var(--ink-deep);
  letter-spacing: 0.02em;
  text-align: left;
}

.nb { white-space: nowrap; }


/* —— v3 公文风（编辑器：系统仿宋/楷体/黑体/宋体，不内嵌 Fandol） —— */
.theme-v3,
.theme-v3 .page,
.page.gongwen {
  --workspace: #C8C8C8;

# 为什么我认为，结构化面试是最重要、最基础的面试方式

我想介绍一下：为什么我觉得结构化面试是最重要、最基础的一种面试方式，以及为什么我推荐所有人，如果有时间的话，都应该学习和训练一下自己的结构化面试能力。

## 一、结构化的，不只是题目

我们讲结构化面试，本意说的是它的**出题方式和评价方式是结构化的**，能够避免考官随意出题、随意评分。

但在实际训练的过程中，我们会发现，**我们的回答也应该是结构化的**。结构化的表达能够最大程度地提升回答的可理解性，向考官呈现一种逻辑清晰、条理清楚的外在形象，这对获得高分非常有帮助。

而且这种表达能力，并不局限在结构化面试中才有用，在各种不同类型的面试，甚至工作生活场景中，作用都非常大。

## 二、结构化表达，是所有面试拿高分的必经之路

无论是什么样的面试，都需要我们进行结构化的表达。或者说，结构化表达对于任何面试来说，都是拿高分的必经之路。没有考官会喜欢一个说话逻辑不清、车轱辘话来回说、讲不到重点上的考生。

所以，结构化面试能够获得高分的人，哪怕去参加其他类型的面试，比如无领导、半结构化、结构化小组、材料结构化等等，只要稍微调整一下技巧、适应一下节奏，也很容易获得较高的分数。

下面我逐个来说。

## 三、半结构化面试：自由提问，也要结构化

半结构化面试，实际上有一半的题目是结构化的，比如一两道是题库里已经出好的题目，这和普通的结构化面试题目基本一致。同时，考官还会根据岗位或者考生的情况进行一些自由提问。

在自由提问的环节，我们同样应该以结构化表达的方式来输出内容：**找到一条答题的基本思路，列出基本的答题点，同时有节奏、有逻辑、清晰地展开。**虽然题目的类型不固定，但对答题逻辑感、层次感的要求是一致的。

经过结构化面试训练的同学，能够更好地组织自己的思路和语言，并以恰当、有条理的方式呈现出来。分层分点，不论答什么样的题目，都容易获得高分。

## 四、结构化小组面试：互动点评也要有逻辑

结构化小组面试，实际上是结构化的题目，加上互动点评的环节。互动点评同样需要逻辑清晰，我们需要有效地组织对其他考生答题内容的评价：

1. 它的优点是什么，从哪几个方面可以看出来；
2. 它的缺点是什么，应该从哪几个方面进行提升。

这可以是一个很简单的思路，但如果我们能够结构化地表达和输出，整体的呈现效果就会非常好，容易获得高分。

## 五、材料结构化：只是输入端变了

材料结构化是近几年新出现的一种面试方式。和传统结构化的区别是，它会先给你看大段的材料，需要根据材料的内容来作答。

这个改变，**实际上只是在信息的输入端**：原来你获取到的信息只是一个简单的题目，现在在题目之外，要叠加一个背景材料。所以我们受到的约束会更多一些，需要先对材料进行提炼、提取，再来组织答案。

但在输出端，结构化的要求是一致的。内容不能过于天马行空，需要回归材料，根据材料已有的思路方向来组织自己的内容。不论是材料的归纳整理，还是自己内容的输出，都要严格遵循结构化的思路，做到层次分明、条理清晰。

如果一个同学结构化面试的能力很强，迁移到材料结构化上不会有任何困难，只是在原来的能力基础上，再叠加一点内容的限制。

而这个限制，一方面是对思路的约束，另一方面也给我们提供了大量的思考线索。

&gt; 在某种程度上，它是让面试的难度下降了，而不是提升了。

## 六、无领导小组讨论：看起来最不一样，底层却最相通

无领导小组讨论，表面上看起来和结构化面试大相径庭，但实际上在底层能力上联系非常紧密。

考官在衡量一个考生的水平时，最主要的抓手，还是看他是否具备**结构化的思考和表达能力**：

- 一开始的陈述，你能否逻辑清晰地阐明自己的观点？
- 在和别人的讨论交流中，你能否精准地抓住别人答题的要点和问题，同时逻辑清晰、结构化地表达自己的意见建议？

在任何一种面试形式中，表达永远是你最有力的武器，也是别人接触你、了解你、评判你的最重要抓手。

### 误区一：抢话头、说服别人，就赢了

很多人会陷入一种误区，觉得如果能抢到更多的话头，或者让别人同意自己的观点，就会获得最终的胜利。这个理解有时看起来确实如此，但有时未必。因为它只看到了表面，没有看到底层的评价标准。

底层的评价标准，依然是这个考生分析问题是否准确深入，头脑是否清楚，表达是否清晰。经过结构化面试训练的同学，在这方面会很有优势。

如果你有更多的机会发言，发言又更有说服力，那确实，你会获得更多被考官评价的机会，但考官的评价未必是正面的。如果你叽里咕噜说了一大堆，逻辑混乱，完全没说到点子上，那你的分数会一直往下扣，而不是一直往上增。

### 重点是展示，而非说服

无领导小组讨论中，我们的目的不是说服别人，而是展示自己。再强调一下：**重点是展示，而非说服。**

你一开始选择的观点，最后是否成为集体的共识，一点也不重要，不会有任何加分或者减分。有人和你意见不一致，实际上是好事而非坏事，因为意见的分歧会给你大量解释、澄清的机会。你的目的，是通过这样的机会来展示自己的结构化表达能力和沟通能力，而不是赢得这场争辩。

### 建设性倒戈

在实战中，高手往往会在充分展示完自己的观点后，主动放弃自己的观点，转而站到对方的角度，同意他的观点，并进一步完善它。这叫**建设性倒戈**。

这个技巧在实战中屡试不爽：既很好地展示了自己全面的思考和表达能力（两个对立的观点都能考虑周全），又给考官、给其他考生留下了有风度、有大局观的形象。

但所有这些技巧，都建立在结构化输出表达能力的基础之上。没有这样的表达能力，你知道再多技巧也没有用。

## 七、为什么用结构化面试来训练

结构化面试的出题类型是有限的，场景是有限的，答题思路又相对固定，所以能够非常好地帮助我们快速掌握结构化输出表达的能力。这是在一种受控的条件下，对我们进行高密度的表达训练。

如果直接去做无领导小组讨论，现场的环境过于多变，需要考虑的因素太多，会干扰我们实际的结构化输出表达，这不是一个高效的训练方式。

**好的训练方式应该是条件控制的**，这样才能更好地实现专项训练，针对性地提高对应能力。结构化面试恰恰提供了这样的训练条件和训练场景。

## 八、我为什么只专注做结构化面试

这就是为什么我一直在专注地做结构化面试，而没有盲目地去拓展到结构化小组、半结构化乃至无领导小组讨论。实际上，这些面试我也掌握得很好，实战效果也很好。

但这些面试并不单独成立，它们都是在结构化表达能力的基础上，叠加一些个性化的实战小技巧。如果结构化面试的基础扎实，那么无论是什么样的面试形式，不论题目怎么变化，都能很快上手，真正做到以不变应万变，大道至简。

当然，我对面试的这些理解，并不是哪一位老师教给我的，也不是看了哪个课程。这些都是我在实战中不断打磨、在教学中不断归纳提炼，最终形成的属于自己的思考方向和思考方式。

我通过文字或者视频记录下来，是想让很多迷茫的考生看到：原来还可以这样看待面试，原来应该这样思考和训练。

## 九、知道，不等于做到

我的这些内容，更多是一种**方向上的指引**，而不是直接把面试能力装进你的脑子、嘴巴里。面试能力的真正建立，离不开极大量的刻苦训练，这就是为什么我提倡大家要大量地开口练习。

你知道了这样的基础思路之后，练习起来效率可能会更高，事半功倍。但如果只是知道而没有练习，上了考场之后，照样会脑子空白，一句话也说不出来。

这个世界终究是物质的，物质终究是实践的。我们必须在实践中，才能完成自己能力的提升。
</textarea>

<script>
/* XHS long-article card engine: parse markdown, paginate, render 1080x1440 pages. */
(function (global) {
  const CN = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

  function cnNum(n) {
    if (n >= 1 && n <= 10) return CN[n];
    if (n < 20) return "十" + (n === 10 ? "" : CN[n - 10]);
    if (n < 100) {
      const t = Math.floor(n / 10), o = n % 10;
      return CN[t] + "十" + (o ? CN[o] : "");
    }
    return String(n);
  }


  function normalizeSize(s) {
    const v = String(s || "").trim().toLowerCase();
    if (v === "small" || v === "sm" || v === "s") return "small";
    if (v === "large" || v === "lg" || v === "l" || v === "big") return "large";
    return "standard";
  }

  function resolveSize(cfg, meta) {
    return normalizeSize((cfg && cfg.size) || (meta && meta.size));
  }

  let currentSize = "standard";

  function applySizeClass(node) {
    if (!node || !node.classList) return;
    node.classList.remove("size-small", "size-standard", "size-large");
    node.classList.add("size-" + currentSize);
  }

  function sizeClass() {
    return " size-" + currentSize;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/==(.+?)==/g, '<span class="hl">$1</span>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>');
    return t;
  }

  function formatCoverTitle(title) {
    // Allow **emphasis**; break after the first Chinese comma.
    const raw = String(title || "").trim();
    if (!raw) return "";
    let parts = raw.split("，");
    const htmlParts = parts.map((p, i) => {
      const chunk = p + (i < parts.length - 1 ? "，" : "");
      return chunk.replace(/\*\*(.+?)\*\*/g, '<span class="em">$1</span>');
    });

    function safe(seg) {

      seg.replace(/<span class="em">([\s\S]*?)<\/span>|([^<]+)/g, (_, em, text) => {
        if (em != null) bits.push('<span class="em">' + escapeHtml(em) + "</span>");
        else if (text) bits.push(escapeHtml(text));
        return "";
      });
      return bits.join("");
    }
    if (htmlParts.length === 1) return safe(htmlParts[0]);
    return safe(htmlParts[0]) + "<br>" + htmlParts.slice(1).map(safe).join("");
  }

  function formatHeading(title) {
    const t = String(title || "");
    if (t.length >= 18 && t.indexOf("，") !== -1) {
      const i = t.indexOf("，");
      return escapeHtml(t.slice(0, i + 1)) + "<br>" + escapeHtml(t.slice(i + 1));
    }
    return escapeHtml(t);
  }

    const src = String(md || "").replace(/^\uFEFF/, "");
    if (!src.startsWith("---")) return { meta: {}, body: src };
    const nl = src.indexOf("\n");
    const end = src.indexOf("\n---", nl);

    const fm = src.slice(nl + 1, end);
    let body = src.slice(end + 4);
    if (body.startsWith("\n")) body = body.slice(1);

    fm.split("\n").forEach((line) => {

      if (m) meta[m[1]] = m[2].trim();

  const UL = /^\s*[-*•]\s+(.+)$/;


  function parseKVBlock(text, aliases) {
    const out = {};
    const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
    let listKey = null;
    lines.forEach((line) => {
      const trimmed = line.trim();
      if (!trimmed) return;
      const m = trimmed.match(/^([A-Za-z0-9_]+)\s*:\s*(.*)$/);
      if (m) {
        const rawKey = m[1].toLowerCase();
        const key = (aliases && aliases[rawKey]) || rawKey;
        const val = m[2].trim();
        listKey = null;
        if (key === "points") {
          out.points = out.points || [];
          listKey = "points";
          if (val) out.points.push(val);
        } else {
          out[key] = val;
        }
        return;
      }
      const item = trimmed.match(/^[-*•]\s+(.+)$/) || trimmed.match(/^\d+[\.、]\s+(.+)$/);
      if (item) {
        const k = listKey || "points";
        if (!Array.isArray(out[k])) out[k] = [];
        out[k].push(item[1]);
      }
    });
    return out;
  }

  function parseProductBody(text) {
    const kv = parseKVBlock(text, {
      title: "name",
      img: "image",
      src: "image",
      howto: "how",

      howtoget: "how",

    return {

  function parseMarkdown(md) {
    const { meta, body } = parseFrontmatter(md);
    const lines = body.replace(/\r\n/g, "\n").split("\n");
    const lead = [];
    const groups = [];
    let cur = null;
    let sectionIndex = 0;
    let parent = null;
    let buf = [];
    let list = null; // {type, items}

    function flushText() {
      if (list) {
        if (cur) cur.blocks.push(list);
        else lead.push(list);
        list = null;
      }
      const text = buf.join("\n").trim();
      buf = [];
      if (!text) return;
      const block = { type: "p", text };
      if (cur) cur.blocks.push(block);
      else lead.push(block);
    }

    function ensureGroup() {
      if (!cur) {
        // stray content before first heading already in lead
      }
    }

    function startGroup(kind, title, parentRef) {
      flushText();
      if (kind === "h2") {
        sectionIndex += 1;
        const m = title.match(H2_NUM);
        const clean = m ? title.slice(m[0].length) : title;
        const cn = cnNum(sectionIndex);
        cur = {
          kind: "h2",
          index: sectionIndex,
          cn,
          title: clean,
          kicker: "第" + cn + "节",
          blocks: [],
        };
        parent = cur;
        groups.push(cur);
      } else {
        const p = parentRef || parent;
        const short = p
          ? (p.title.split("：")[0].split(":")[0])
          : "";
        const cn = p ? p.cn : cnNum(sectionIndex || 1);
        cur = {
          kind: "h3",
          index: p ? p.index : sectionIndex,
          cn,
          title: title,
          kicker: short ? cn + " · " + short : "第" + cn + "节",
          blocks: [],
        };
        groups.push(cur);
      }
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const trimmed = line.trim();
      if (trimmed.startsWith("```")) {
        flushText();
        const lang = trimmed.slice(3).trim().toLowerCase();
        const bodyLines = [];
        i += 1;
        while (i < lines.length && !lines[i].trim().startsWith("```")) {
          bodyLines.push(lines[i]);
          i += 1;
        }
        const body = bodyLines.join("\n");
        if (lang === "product") {
          pushBlock(cur, lead, parseProductBody(body));
        } else if (lang === "screenshot" || lang === "shot") {
          pushBlock(cur, lead, parseScreenshotBody(body));
        }
        continue;
      }
      const imgLine = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)(\s*<!--\s*fullpage\s*-->)?\s*$/i);
      if (imgLine) {
        flushText();
        const fullpage = !!imgLine[3];
        pushBlock(cur, lead, {
          type: fullpage ? "screenshot" : "image",
          src: imgLine[2].trim(),
          caption: imgLine[1].trim(),
        });
        continue;
      }
      if (trimmed === "<!-- pagebreak -->" || trimmed === "<!-- page-break -->") {
        flushText();
        if (cur) cur.blocks.push({ type: "pagebreak" });
        continue;
      }
      if (trimmed.startsWith(">")) {
        flushText();
        let quote = trimmed.replace(/^>\s?/, "");
        while (i + 1 < lines.length && lines[i + 1].trim().startsWith(">")) {
          i += 1;
          quote += lines[i].trim().replace(/^>\s?/, "");
        }
        const block = { type: "quote", text: quote };
        if (cur) cur.blocks.push(block);
        else lead.push(block);
        continue;
      }
      if (/^#\s+/.test(trimmed) && !/^##/.test(trimmed)) {
        flushText();
        if (!meta.subtitle) meta.subtitle = trimmed.replace(/^#\s+/, "");
        continue;
      }
      if (/^##\s+/.test(trimmed) && !/^###/.test(trimmed)) {
        startGroup("h2", trimmed.replace(/^##\s+/, ""));
        continue;
      }
      if (/^###\s+/.test(trimmed)) {
        startGroup("h3", trimmed.replace(/^###\s+/, ""));
        continue;
      }
      const ol = trimmed.match(OL);
      const ul = trimmed.match(UL);
      if (ol || ul) {
        if (buf.length) {
          const text = buf.join("\n").trim();
          buf = [];
          if (text) {
            const block = { type: "p", text };
            if (cur) cur.blocks.push(block);
            else lead.push(block);
          }
        }
        const typ = ol ? "ol" : "ul";
        const item = ol ? ol[2] : ul[1];
        if (!list || list.type !== typ) {
          if (list) {
            if (cur) cur.blocks.push(list);
            else lead.push(list);
          }
          list = { type: typ, items: [] };
        }
        list.items.push(item);
        continue;
      }
      if (trimmed === "") {
        flushText();
        continue;
      }
      if (list) {
        if (cur) cur.blocks.push(list);
        else lead.push(list);
        list = null;
      }
      buf.push(line);
    }
    flushText();
    return { meta, lead, groups };
  }

  function breakBalanced(s) {
    const text = String(s || "");
    if (text.length <= 18) return escapeHtml(text);
    const mid = text.length / 2;
    const cands = [];
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if ("，、；。 ".includes(ch) || (ch === "是" && i >= 8 && i < text.length - 6)) {
        cands.push(i);
      }
    }
    let best = -1, bestScore = 1e9;
    for (const i of cands) {
      const left = i + 1, right = text.length - i - 1;
      if (left < 8 || right < 6) continue;
      const score = Math.abs(left - mid);
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best < 0) return escapeHtml(text);
    return escapeHtml(text.slice(0, best + 1)) + "<br>" + escapeHtml(text.slice(best + 1));
  }

  function overflows(page) {
    const footer = page.querySelector(".footer, .cover-bottom");
    const frame = page.querySelector(".frame");
    if (!frame) return false;
    if (!footer) return frame.scrollHeight > frame.clientHeight + 1;
    const content = page.querySelector(".prose, .cover-lead, .content");
    if (!content) return false;
    const last = content.lastElementChild || content;
    const gap = 28;
    const lastBox = last.getBoundingClientRect();
    const footBox = footer.getBoundingClientRect();
    return lastBox.bottom > footBox.top - gap;
  }

  function wrapLastChars(el, n) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    let need = n;
    for (let i = nodes.length - 1; i >= 0 && need > 0; i--) {
      const node = nodes[i];
      let text = node.textContent;
      if (!text) continue;
      const trail = text.match(/\s*$/)[0];
      const core = text.slice(0, text.length - trail.length);
      if (!core) continue;
      const take = Math.min(need, core.length);
      const splitAt = core.length - take;
      const right = core.slice(splitAt) + trail;
      const left = core.slice(0, splitAt);
      const span = document.createElement("span");
      span.className = "nb";
      span.textContent = right;
      node.textContent = left;
      node.parentNode.insertBefore(span, node.nextSibling);
      need -= take;
    }
  }

  function fitFigureInPage(page, figure) {
    if (!page || !figure) return;
    const img = figure.querySelector("img");
    if (!img) return;
    const cap = figure.querySelector("figcaption");
    const footer = page.querySelector(".footer");
    const gap = page.querySelector(".doc") ? 16 : 28;
    const limitBottom = footer
      ? footer.getBoundingClientRect().top - gap
      : page.getBoundingClientRect().bottom - 16;
    const top = figure.getBoundingClientRect().top;
    const capH = cap ? Math.max(cap.getBoundingClientRect().height, 40) + 8 : 0;
    let avail = Math.floor(limitBottom - top - capH);
    if (avail < 80) avail = 80;
    img.style.maxWidth = "100%";
    img.style.width = "auto";
    img.style.height = "auto";
    img.style.maxHeight = avail + "px";
    img.style.objectFit = "contain";
    if (cap) {
      const capBox = cap.getBoundingClientRect();
      if (capBox.bottom > limitBottom + 1) {

        img.style.maxHeight = Math.max(80, avail - extra) + "px";

  }

  function maxDocTitleChars(ctx) {
    const el = ctx || document.getElementById("deck") || document.documentElement;
    const s = getComputedStyle(el);
    const size = parseFloat(s.getPropertyValue("--doc-title-size")) || 50;
    const paperW = parseFloat(s.getPropertyValue("--paper-w")) || 1032;
    const padX = parseFloat(s.getPropertyValue("--paper-pad-x")) || 72;
    const avail = paperW - 2 * padX;

    return Math.max(8, Math.floor(avail / advance));

  function breakDocTitle(text, ctx) {
    const chars = Array.from(String(text || ""));
    const punct = "，、；。：";
    const max = maxDocTitleChars(ctx);
    const weak = "的是和与或而";
    function place(limit) {
      let best = -1, bestScore = 1e9;
      for (let i = 0; i < chars.length; i++) {
        const left = i + 1;
        const right = chars.length - left;
        if (left < 2 || right < 2 || left > limit || right > limit) continue;
        let score = Math.abs(left - right);
        const ch = chars[i];
        if (punct.indexOf(ch) !== -1) score -= 20;
        else if (weak.indexOf(ch) !== -1) score -= 8;
        if (left < 4 || right < 4) score += 20;
        if (score < bestScore) {
          best = i;
          bestScore = score;
        }
      }
      return best;
    }
    if (chars.length <= max) return escapeHtml(chars.join(""));
    let at = place(max);
    if (at < 0) at = place(max + 1);
    if (at >= 0) {
      return escapeHtml(chars.slice(0, at + 1).join("")) + "<br>" + escapeHtml(chars.slice(at + 1).join(""));
    }
    return escapeHtml(chars.slice(0, max).join("")) + "<br>" + escapeHtml(chars.slice(max).join(""));
  }

  function collectChars(node) {
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null);
    const chars = [];
    while (walker.nextNode()) {
      const tn = walker.currentNode;
      const s = tn.textContent || "";
      for (let i = 0; i < s.length; i++) {
        const range = document.createRange();
        range.setStart(tn, i);
        range.setEnd(tn, i + 1);
        const b = range.getBoundingClientRect();
        if (!b.width && !b.height) continue;
        chars.push({ x: b.left, y: b.top, right: b.right });
      }
    }
    return chars;
  }

  function visualLinesFromChars(chars) {
    const lines = [];
    chars.forEach((c) => {
      let line = lines.find((l) => Math.abs(l.y - c.y) < 4);
      if (!line) {
        line = { y: c.y, chars: [] };
        lines.push(line);
      }
      line.chars.push(c);
    });
    lines.forEach((l) => l.chars.sort((a, b) => a.x - b.x));
    return lines;
  }

  function paragraphHasStretch(node) {
    const fs = parseFloat(getComputedStyle(node).fontSize) || 37;
    const indent = parseFloat(getComputedStyle(node).textIndent) || 0;
    const boxW = node.getBoundingClientRect().width;
    const prevAlign = node.style.textAlign;
    const prevLast = node.style.textAlignLast;
    node.style.textAlign = "left";
    node.style.textAlignLast = "start";
    const lines = visualLinesFromChars(collectChars(node));
    const limit = fs * 0.1;
    let stretched = false;
    lines.forEach((line, i) => {
      if (i === lines.length - 1) return;
      const row = line.chars;
      if (row.length < 2) return;
      const w = row[row.length - 1].right - row[0].x;
      const avail = boxW - (i === 0 ? indent : 0);
      const per = (avail - w) / (row.length - 1);
      if (per > limit) stretched = true;
    });
    node.style.textAlign = prevAlign;
    node.style.textAlignLast = prevLast;
    return stretched;
  }

  function fixJustifiedStretch(page) {
    page.querySelectorAll("p, .ol-item, .ul-item").forEach((node) => {
      if (paragraphHasStretch(node)) node.classList.add("no-justify");
    });
  }

  function gongwenOverflows(page) {
    const footer = page.querySelector(".footer");
    const doc = page.querySelector(".doc");
    if (!footer || !doc) return false;
    const last = doc.lastElementChild;
    if (!last) return false;
    const gap = 16;
    return last.getBoundingClientRect().bottom > footer.getBoundingClientRect().top - gap;
  }

  function remainingBelow(page, node) {
    const footer = page.querySelector(".footer");
    if (!footer || !node) return 0;
    return footer.getBoundingClientRect().top - 16 - node.getBoundingClientRect().bottom;
  }

  function isHeadingNode(node) {
    return node && (node.classList.contains("h1-title") || node.classList.contains("h2-title") || node.classList.contains("h3-title") || node.classList.contains("doc-title"));
  }

  function documentStream(parsed, meta) {
    const out = [];
    let title = meta.subtitle || "";
    if (!title) {
      title = String(meta.cover_title || meta.coverTitle || "").replace(/\*\*/g, "");
    }
    out.push({ type: "doc-title", text: title });
    out.push({ type: "doc-author", text: meta.author || "一个路人甲" });
    function expandProduct(b, target) {
      target.push({ type: "h2", text: "附件：产品说明" });
      if (b.name) {
        target.push({ type: "p", text: "名称：" + b.name, className: "product-doc-name no-justify" });
      }
      if (b.tagline) target.push({ type: "p", text: b.tagline });
      (b.points || []).forEach((it, i) => {
        target.push({ type: "li", list: "ol", index: i, text: it });
      });
      target.push({
        type: "p",
        text: "价格：" + (b.price || "待确认") + "　　获取方式：" + (b.how || "待确认"),
        className: "no-justify",
      });
      if (b.image) {
        target.push({ type: "screenshot", src: b.image, caption: b.caption || "", fromProduct: true });
      }
    }
    function expandLeadOrBlock(b, target) {
      if (b.type === "product") expandProduct(b, target);
      else target.push(b);
    }
    (parsed.lead || []).forEach((b) => expandLeadOrBlock(b, out));
    (parsed.groups || []).forEach((g) => {
      const text = g.kind === "h2" ? (g.cn + "、" + g.title) : g.title;
      out.push({ type: g.kind, text: text });
      (g.blocks || []).forEach((b) => {
        if (b.type === "pagebreak") {
          out.push(b);
        } else if (b.type === "ol" || b.type === "ul") {
          (b.items || []).forEach((it, i) => {
            out.push({ type: "li", list: b.type, index: i, text: it });
          });
        } else if (b.type === "product") {
          expandProduct(b, out);
        } else {
          out.push(b);
        }
      });
    });
    let figN = 0;
    out.forEach((b) => {
      if (b && (b.type === "image" || b.type === "screenshot")) {
        figN += 1;
        b.figNo = figN;
      }
    });
    return out;
  }

  function renderGongwen(deck, cfg, parsed, meta) {
    deck.innerHTML = "";
    applySizeClass(deck);
    const pages = [];
    const probe = makeGongwenPage();
    deck.appendChild(probe);
    const LINE = parseFloat(getComputedStyle(probe).getPropertyValue("--line")) || 65;
    const KEEP = LINE * 2 + 8;
    deck.removeChild(probe);

    function newPage() {
      const page = makeGongwenPage();
      deck.appendChild(page);
      pages.push(page);
      return page;
    }

    let page = newPage();
    let doc = page.querySelector(".doc");
    const stream = documentStream(parsed, meta);

    function moveTrailingHeading(fromDoc, toDoc) {
      const last = fromDoc.lastElementChild;
      if (last && isHeadingNode(last)) {
        toDoc.insertBefore(last, toDoc.firstChild);
      }
    }

    for (let i = 0; i < stream.length; i++) {
      const block = stream[i];
      if (block.type === "pagebreak") {
        if (doc.children.length) {
          page = newPage();
          doc = page.querySelector(".doc");
        }
        continue;
      }
      const node = renderGongwenNode(block);
      if (!node) continue;
      const isFig = node.tagName === "FIGURE" || (node.classList && node.classList.contains("doc-fig"));
      const isShot = isFig && block.type === "screenshot";
      // full-page screenshots start on a fresh page; inline figures try to stay put
      if (isShot && doc.children.length) {
        page = newPage();
        doc = page.querySelector(".doc");
      }
      doc.appendChild(node);
      if (isFig) fitFigureInPage(page, node);

      const heading = isHeadingNode(node);
      const tight = heading && remainingBelow(page, node) < KEEP;
      const over = gongwenOverflows(page);

      if (!over && !tight) continue;

      doc.removeChild(node);
      if (doc.children.length === 0) {
        // first block on a fresh page still overflowed; keep it anyway
        doc.appendChild(node);
        if (isFig) fitFigureInPage(page, node);
        continue;
      }
      page = newPage();
      doc = page.querySelector(".doc");
      // if we just overflowed a body block and left a heading behind, bring it along
      const prevPage = pages[pages.length - 2];
      if (prevPage && !heading) {
        moveTrailingHeading(prevPage.querySelector(".doc"), doc);
      }
      doc.appendChild(node);
      if (isFig) fitFigureInPage(page, node);
    }

    pages.forEach((pg) => {
      // Widow wrap first: it can shorten the previous line, which justify would then stretch.
      pg.querySelectorAll("p, .ol-item, .ul-item").forEach((node) => {
        const fs = parseFloat(getComputedStyle(node).fontSize) || 37;
        const rects = lineRects(node);
        if (rects.length < 2) return;
        if (rects[rects.length - 1].width > fs * 3.4) return;
        wrapLastChars(node, 5);
      });
      fixJustifiedStretch(pg);
    });

    pages.forEach((pg, idx) => {
      const n = idx + 1;
      const node = pg.querySelector(".pg");
      if (node) node.textContent = "— " + n + " —";
    });
    return pages;
  }

  function render(deck, config) {
    const cfg = config || {};
    const parsed = parseMarkdown(cfg.markdown || "");
    const meta = Object.assign({}, parsed.meta, cfg);
    currentSize = resolveSize(cfg, meta);
    meta.size = currentSize;
    applySizeClass(deck);
    // normalize aliases from the form
    if (cfg.coverTitle && !cfg.cover_title) meta.cover_title = cfg.coverTitle;
    if (cfg.coverKicker && !cfg.cover_kicker) meta.cover_kicker = cfg.coverKicker;
    if (!meta.cover_title) meta.cover_title = "结构化面试，是所有面试的**地基**";
    if (!meta.badge) meta.badge = "考公面试干货";
    if (!meta.series) meta.series = "结构化面试 · 地基";
    if (!meta.author) meta.author = "一个路人甲";
    if (meta.role == null) meta.role = "自学面试上岸";

    const leadHtml = parsed.lead
      .filter((b) => b.type === "p")
      .map((b) => inline(b.text))
      .join("");
    meta.leadHtml = leadHtml;

    if (isGongwen(cfg) || isGongwen(meta)) {
      return renderGongwen(deck, cfg, parsed, meta);
    }

    deck.innerHTML = "";
    const pages = [];

    const cover = makeCover(meta, 1);
    deck.appendChild(cover);
    pages.push(cover);

    function startPage(group, kicker, n, compact) {
      const page = makeInner(meta, {
        kicker: kicker,
        title: group.title,
        n: n,
        total: 1,
        compact: compact,
      });
      deck.appendChild(page);
      pages.push(page);
      return page;
    }

    function startNamedPage(kind, kicker, title) {
      const page = makeInner(meta, {
        kicker: kicker,
        title: title,
        n: pages.length + 1,
        total: 1,
        compact: false,
      });
      page.classList.add(kind);
      page.setAttribute("data-page-kind", kind === "product-page" ? "product" : "shot");
      deck.appendChild(page);
      pages.push(page);
      return page;
    }

    let page = null;
    let prose = null;

    function placeShot(src, caption) {
      page = startNamedPage("shot-page", "资料截图", caption || "截图");
      prose = page.querySelector(".prose");
      const fig = figureEl(src, caption, "fig-shot");
      prose.appendChild(fig);
      fitFigureInPage(page, fig);
      return page;
    }

    function productFlowNodes(block) {
      const nodes = [];
      if (block.tagline) {
        nodes.push(el('<div class="product-tagline">' + inline(block.tagline) + "</div>"));
      }
      if (block.points && block.points.length) {
        const items = block.points.map((it, idx) => {
          return "<li><span class=\"idx\">" + (idx + 1) + "</span>" + inline(it) + "</li>";
        }).join("");
        nodes.push(el('<ol class="points product-points">' + items + "</ol>"));
      }
      nodes.push(el(
        '<div class="product-meta">' +
          '<div class="product-row"><span class="k">价格</span><span class="v">' + inline(block.price || "待确认") + "</span></div>" +
          '<div class="product-row"><span class="k">获取方式</span><span class="v">' + inline(block.how || "待确认") + "</span></div>" +
        "</div>"
      ));
      return nodes;
    }

    function placeProduct(block) {
      page = startNamedPage("product-page", "资料介绍", block.name || "资料介绍");
      prose = page.querySelector(".prose");
      const h1 = page.querySelector("h1");
      if (h1) wrapLastChars(h1, 4);
      productFlowNodes(block).forEach((node) => {
        prose.appendChild(node);
        if (!overflows(page)) return;
        if (!page.classList.contains("compact")) {
          page.classList.add("compact");
          if (!overflows(page)) return;
          page.classList.remove("compact");
        }
        prose.removeChild(node);
        if (prose.children.length === 0) {
          page.classList.add("compact");
          prose.appendChild(node);
          return;
        }
        page = startNamedPage("product-page", "资料介绍 · 续", block.name || "资料介绍");
        prose = page.querySelector(".prose");
        const h = page.querySelector("h1");
        if (h) wrapLastChars(h, 4);
        prose.appendChild(node);
        if (overflows(page)) page.classList.add("compact");
      });
      if (block.image) {
        const fig = figureEl(block.image, block.caption, "fig-product");
        prose.appendChild(fig);
        fitFigureInPage(page, fig);
        if (overflows(page) || imageCramped(fig, page)) {
          prose.removeChild(fig);
          placeShot(block.image, block.caption);
        }
      }
    }

    function placeImage(block) {
      const full = block.type === "screenshot";
      const onFlow = page && prose && !full
        && !page.classList.contains("product-page")
        && !page.classList.contains("shot-page")
        && !page.classList.contains("cover");
      if (!onFlow) {
        placeShot(block.src, block.caption);
        return;
      }
      const fig = figureEl(block.src, block.caption, "fig-inline");
      prose.appendChild(fig);
      fitFigureInPage(page, fig);
      if (overflows(page) || imageCramped(fig, page)) {
        prose.removeChild(fig);
        placeShot(block.src, block.caption);
      }
    }

    (parsed.lead || []).forEach((b) => {
      if (b.type === "product") placeProduct(b);
      else if (b.type === "screenshot" || b.type === "image") placeImage(b);
    });

    parsed.groups.forEach((group) => {
      let usedKicker = group.kicker;
      let sectionStarted = false;
      let detached = false;
      page = null;
      prose = null;

      const hasNormal = group.blocks.some((b) => b.type !== "pagebreak" && !isSpecial(b));
      const hasSpecial = group.blocks.some(isSpecial);
      if (!hasNormal && !hasSpecial) {
        page = startPage(group, usedKicker, pages.length + 1, false);
        prose = page.querySelector(".prose");
        sectionStarted = true;
      }

      function ensureSectionPage(forceNew) {
        if (!page || forceNew || detached
            || page.classList.contains("product-page")
            || page.classList.contains("shot-page")) {
          const kicker = sectionStarted ? ("第" + group.cn + "节 · 续") : group.kicker;
          page = startPage(group, kicker, pages.length + 1, false);
          prose = page.querySelector(".prose");
          sectionStarted = true;
          detached = false;
        }
      }

      function newContinuation() {
        ensureSectionPage(true);
      }

      for (let bi = 0; bi < group.blocks.length; bi++) {
        const block = group.blocks[bi];
        if (block.type === "pagebreak") {
          if (prose && prose.children.length && !detached) detached = true;
          else if (prose && prose.children.length) detached = true;
          detached = true;
          continue;
        }
        if (block.type === "product") {
          placeProduct(block);
          detached = true;
          continue;
        }
        if (block.type === "screenshot" || block.type === "image") {
          placeImage(block);
          if (page && (page.classList.contains("shot-page") || block.type === "screenshot")) {
            detached = true;
          }
          continue;
        }
        ensureSectionPage(false);
        const node = renderBlock(block);
        if (!node) continue;
        prose.appendChild(node);
        if (!overflows(page)) continue;

        const placed = prose.children.length;
        const footer = page.querySelector(".footer");
        const overflowPx = footer
          ? (node.getBoundingClientRect().bottom - (footer.getBoundingClientRect().top - 28))
          : 999;
        const moreComing = group.blocks.slice(bi + 1).some((b) => b.type !== "pagebreak" && !isSpecial(b));
        const allowCompact = placed <= 1 || (overflowPx > 0 && overflowPx <= 80 && !moreComing);
        if (allowCompact && !page.classList.contains("compact")) {
          page.classList.add("compact");
          if (!overflows(page)) continue;
          page.classList.remove("compact");
        }

        prose.removeChild(node);
        if (prose.children.length === 0) {
          page.classList.add("compact");
          prose.appendChild(node);
          continue;
        }
        newContinuation();
        prose.appendChild(node);
        if (overflows(page) && !page.classList.contains("compact")) {
          page.classList.add("compact");
        }
      }
    });

    pages.forEach(fixWidows);

    // End mark on the last inner page (or cover if no inner)
    const last = pages[pages.length - 1];
    if (last && !last.classList.contains("cover")) {
      const lastProse = last.querySelector(".prose");
      if (lastProse && !lastProse.querySelector(".end-mark")) {
        lastProse.appendChild(el('<div class="end-mark">完</div>'));
        const isSpecialPage = last.classList.contains("shot-page") || last.classList.contains("product-page");
        if (isSpecialPage) {
          const fig = lastProse.querySelector(".fig");
          if (fig) fitFigureInPage(last, fig);
          if (overflows(last)) {
            last.classList.add("compact");
            if (fig) fitFigureInPage(last, fig);
            if (overflows(last)) {
              const mark = lastProse.querySelector(".end-mark");
              if (mark) mark.remove();
              last.classList.remove("compact");
              if (fig) fitFigureInPage(last, fig);
            }
          }
        } else if (overflows(last)) {
          last.classList.add("compact");
          if (overflows(last)) {
            last.classList.remove("compact");
            const mark = lastProse.querySelector(".end-mark");
            const blocks = [...lastProse.children].filter((n) => !n.classList.contains("end-mark"));
            const prev = blocks.length >= 2 ? mark.previousElementSibling : null;
            const kickerEl = last.querySelector(".sec-kicker");
            const titleEl = last.querySelector("h1");
            const kicker = (kickerEl && kickerEl.textContent) || "";
            const title = (titleEl && titleEl.textContent) || "";
            const m = kicker.match(/第([一二三四五六七八九十百]+)节/);
            const nk = m ? ("第" + m[1] + "节 · 续") : (kicker ? kicker + " · 续" : "");
            const next = makeInner(meta, { kicker: nk, title: title, n: pages.length + 1, total: 1, compact: false });
            deck.appendChild(next);
            pages.push(next);
            const np = next.querySelector(".prose");
            if (prev) np.appendChild(prev);
            np.appendChild(mark);
            if (overflows(next)) next.classList.add("compact");
          }
        }
      }
    }

    updatePageNumbers(pages);
    return pages;
  }

  global.XHS = {
    cnNum,
    parseMarkdown,
    parseFrontmatter,
    formatCoverTitle,
    normalizeSize,
    render,
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
(function () {
  const LS = "xhs-editor-state-v1";
  const $ = (id) => document.getElementById(id);
  const els = {
    md: $("md"),
    coverTitle: $("coverTitle"),
    subtitle: $("subtitle"),
    author: $("author"),
    role: $("role"),
    kicker: $("kicker"),
    badge: $("badge"),
    series: $("series"),
    deck: $("deck"),
    stack: $("pv-stack"),
    status: $("status"),
    themeV1: $("theme-v1"),
    themeV2: $("theme-v2"),
    themeV3: $("theme-v3"),
    sizeSmall: $("size-small"),
    sizeStandard: $("size-standard"),
    sizeLarge: $("size-large"),
    exportZip: $("export-zip"),
    exportMd: $("export-md"),
    importMd: $("import-md"),
    importFile: $("import-file"),
  };

  let theme = "v2";
  let size = "standard";
  let timer = null;
  let pages = [];

  function normalizeSize(s) {
    if (window.XHS && XHS.normalizeSize) return XHS.normalizeSize(s);
    const v = String(s || "").trim().toLowerCase();
    if (v === "small" || v === "sm" || v === "s") return "small";
    if (v === "large" || v === "lg" || v === "l" || v === "big") return "large";
    return "standard";
  }

  function paperColor() {
    if (theme === "v1") return "#F6F1E8";
    if (theme === "v3") return "#C8C8C8";
    return "#F5F6F0";
  }

  function currentConfig() {
    return {
      markdown: els.md.value,
      cover_title: els.coverTitle.value,
      subtitle: els.subtitle.value,
      author: els.author.value,
      role: els.role.value,
      cover_kicker: els.kicker.value,
      badge: els.badge.value,
      series: els.series.value,
      layout: theme === "v3" ? "gongwen" : "cards",
      size: size,
      dogSrc: theme === "v2" ? window.XHS_DOG_DATAURI : "",
    };
  }

  function applyThemeClass() {
    document.body.classList.toggle("th-v1", theme === "v1");
    document.body.classList.toggle("th-v2", theme === "v2");
    document.body.classList.toggle("th-v3", theme === "v3");
    els.deck.className = "theme-" + theme + " size-" + size;
    els.stack.className = "pv-stack theme-" + theme + " size-" + size;
    els.themeV1.classList.toggle("on", theme === "v1");
    els.themeV2.classList.toggle("on", theme === "v2");
    els.themeV3.classList.toggle("on", theme === "v3");
    els.sizeSmall.classList.toggle("on", size === "small");
    els.sizeStandard.classList.toggle("on", size === "standard");
    els.sizeLarge.classList.toggle("on", size === "large");
  }

  function render() {
    applyThemeClass();
    try {
      pages = XHS.render(els.deck, currentConfig()) || [];
    } catch (err) {
      els.status.textContent = "渲染出错：" + (err && err.message ? err.message : err);
      console.error(err);
      return;
    }
    els.stack.innerHTML = "";
    pages.forEach((page, i) => {
      const card = document.createElement("div");
      card.className = "pv-card";
      const n = String(i + 1).padStart(2, "0");
      const total = String(pages.length).padStart(2, "0");
      card.innerHTML =
        '<div class="pv-meta"><span>' + n + " / " + total +
        '</span><button type="button" class="btn" data-dl="' + i + '">下载此页 PNG</button></div>' +
        '<div class="pv-frame"><div class="pv-scale"></div></div>';
      card.querySelector(".pv-scale").appendChild(page.cloneNode(true));
      card.querySelector("[data-dl]").addEventListener("click", () => downloadOne(i));
      els.stack.appendChild(card);
    });
    els.status.textContent = "已自动保存 · " + pages.length + " 页";
    save();
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(render, 220);
  }

  function save() {
    const state = {
      theme,
      size,
      markdown: els.md.value,
      cover_title: els.coverTitle.value,
      subtitle: els.subtitle.value,
      author: els.author.value,
      role: els.role.value,
      cover_kicker: els.kicker.value,
      badge: els.badge.value,
      series: els.series.value,
    };
    try { if (!embedded) localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    if (typeof embedded !== "undefined" && embedded) parent.postMessage({ type: "pms:change", state }, "*");
  }

  function load() {
    try {
      const raw = localStorage.getItem(LS);
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (s.theme === "v1" || s.theme === "v2" || s.theme === "v3") theme = s.theme;
      if (s.size) size = normalizeSize(s.size);
      ["markdown", "cover_title", "subtitle", "author", "role", "cover_kicker", "badge", "series"].forEach((k) => {
        const map = {
          markdown: els.md,
          cover_title: els.coverTitle,
          subtitle: els.subtitle,
          author: els.author,
          role: els.role,
          cover_kicker: els.kicker,
          badge: els.badge,
          series: els.series,
        };
        if (s[k] != null && map[k]) map[k].value = s[k];
      });
      return true;
    } catch (e) { return false; }
  }

  function buildMarkdownExport() {
    const fm = [
      "---",
      "cover_title: " + els.coverTitle.value,
      "cover_kicker: " + els.kicker.value,
      "badge: " + els.badge.value,
      "author: " + els.author.value,
      "role: " + els.role.value,
      "series: " + els.series.value,
      "theme: " + theme,
      "size: " + size,
      "---",
      "",
    ].join("\n");
    let body = els.md.value.replace(/^\uFEFF/, "");
    if (body.startsWith("---")) {
      const end = body.indexOf("\n---", 3);
      if (end >= 0) {
        body = body.slice(end + 4);
        if (body.startsWith("\n")) body = body.slice(1);
      }
    }
    if (els.subtitle.value && !/^# /m.test(body)) {
      body = "# " + els.subtitle.value + "\n\n" + body;
    }
    return fm + body;
  }

  function applyImportedMarkdown(text) {
    const parsed = XHS.parseFrontmatter(text);
    const m = parsed.meta || {};
    if (m.cover_title) els.coverTitle.value = m.cover_title;
    if (m.cover_kicker) els.kicker.value = m.cover_kicker;
    if (m.badge) els.badge.value = m.badge;
    if (m.author) els.author.value = m.author;
    if (m.role) els.role.value = m.role;
    if (m.series) els.series.value = m.series;
    if (m.subtitle) els.subtitle.value = m.subtitle;
    if (m.theme === "v1" || m.theme === "v2" || m.theme === "v3") theme = m.theme;
    if (m.size) size = normalizeSize(m.size);
    els.md.value = text;
    const p = XHS.parseMarkdown(text);
    if (p.meta && p.meta.subtitle && !els.subtitle.value) els.subtitle.value = p.meta.subtitle;
    render();
  }

  async function canvasOf(pageEl) {
    const canvas = await html2canvas(pageEl, {
      width: 1080,
      height: 1440,
      scale: 1,
      backgroundColor: paperColor(),
      useCORS: true,
      logging: false,
      windowWidth: 1080,
      windowHeight: 1440,
      onclone: function (doc) {
        // html2canvas 会把跨行的下划线/背景拉满整行，导出时改为纯加粗。
        doc.querySelectorAll(".hl").forEach(function (el) {
          el.style.borderBottom = "none";
          el.style.background = "transparent";
          el.style.boxShadow = "none";
          el.style.fontWeight = "700";
        });
        // 截的是单页 .page，祖先上的主题变量会丢。html2canvas 还会把 .paper 的阴影画成整页灰罩、把两端对齐拉成字距。
        doc.querySelectorAll(".page.gongwen").forEach(function (el) {
          el.style.backgroundColor = "#C8C8C8";
        });
        doc.querySelectorAll(".paper").forEach(function (el) {
          el.style.background = "#FFFFFF";
          el.style.backgroundColor = "#FFFFFF";
          el.style.boxShadow = "none";
          el.style.outline = "1px solid rgba(0,0,0,0.08)";
        });
        if (doc.querySelector(".page.gongwen, .paper")) {
          doc.querySelectorAll("p, .ol-item, .ul-item").forEach(function (el) {
            el.style.textAlign = "left";
            el.style.textAlignLast = "start";
            el.style.letterSpacing = "0";
            el.style.wordSpacing = "0";
            el.style.textJustify = "none";
          });
        }
      }
    });
    return canvas;
  }

  async function downloadOne(i) {
    if (typeof embedded !== "undefined" && embedded && !downloadOne.__force) {
      parent.postMessage({ type: "pms:export-page", index: i, state: editorState() }, "*");
      els.status.textContent = "正在导出第 " + (i + 1) + " 页…";
      return;
    }
    const page = pages[i];
    if (!page) return;
    els.status.textContent = "正在导出第 " + (i + 1) + " 页…";
    const canvas = await canvasOf(page);
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = String(i + 1).padStart(2, "0") + ".png";
    a.click();
    els.status.textContent = "已下载 " + a.download;
  }

  async function downloadZip() {
    if (typeof embedded !== "undefined" && embedded && !downloadZip.__force) {
      parent.postMessage({ type: "pms:export", state: editorState() }, "*");
      els.status.textContent = "正在用成片引擎导出…";
      return;
    }
    if (!pages.length) return;
    els.exportZip.disabled = true;
    els.status.textContent = "正在导出 ZIP…";
    try {
      const zip = new JSZip();
      for (let i = 0; i < pages.length; i++) {
        els.status.textContent = "正在导出 " + (i + 1) + " / " + pages.length + "…";
        const canvas = await canvasOf(pages[i]);
        const data = canvas.toDataURL("image/png").split(",")[1];
        zip.file(String(i + 1).padStart(2, "0") + ".png", data, { base64: true });
      }
      const blob = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "xhs-cards.zip";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      els.status.textContent = "已下载 xhs-cards.zip · " + pages.length + " 页";
    } catch (err) {
      console.error(err);
      els.status.textContent = "导出失败：" + (err && err.message ? err.message : err);
    } finally {
      els.exportZip.disabled = false;
    }
  }

  function downloadMd() {
    const blob = new Blob([buildMarkdownExport()], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "article.md";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // events
  ["md", "coverTitle", "subtitle", "author", "role", "kicker", "badge", "series"].forEach((id) => {
    $(id).addEventListener("input", schedule);
  });
  els.themeV1.addEventListener("click", () => { theme = "v1"; render(); });
  els.themeV2.addEventListener("click", () => { theme = "v2"; render(); });
  els.themeV3.addEventListener("click", () => { theme = "v3"; render(); });
  els.sizeSmall.addEventListener("click", () => { size = "small"; render(); });
  els.sizeStandard.addEventListener("click", () => { size = "standard"; render(); });
  els.sizeLarge.addEventListener("click", () => { size = "large"; render(); });
  els.exportZip.addEventListener("click", downloadZip);
  els.exportMd.addEventListener("click", downloadMd);
  els.importMd.addEventListener("click", () => els.importFile.click());
  els.importFile.addEventListener("change", () => {
    const f = els.importFile.files && els.importFile.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => applyImportedMarkdown(String(reader.result || ""));
    reader.readAsText(f, "utf-8");
    els.importFile.value = "";
  });

  window.XHS_EDITOR = { render, currentConfig, pages: () => pages, setTheme(t) { theme = t; render(); }, setSize(s) { size = normalizeSize(s); render(); } };

  function editorState() {
    return {
      theme, size,
      markdown: els.md.value,
      cover_title: els.coverTitle.value,
      subtitle: els.subtitle.value,
      author: els.author.value,
      role: els.role.value,
      cover_kicker: els.kicker.value,
      badge: els.badge.value,
      series: els.series.value,
    };
  }
  function applyEditorState(s) {
    if (!s) return;
    if (s.theme === "v1" || s.theme === "v2" || s.theme === "v3") theme = s.theme;
    if (s.size) size = normalizeSize(s.size);
    const map = {
      markdown: els.md, cover_title: els.coverTitle, subtitle: els.subtitle, author: els.author,
      role: els.role, cover_kicker: els.kicker, badge: els.badge, series: els.series,
    };
    Object.keys(map).forEach((key) => { if (s[key] != null) map[key].value = s[key]; });
    render();
  }
  window.XHS_EMBED = { applyState: applyEditorState, state: editorState };
  const embedded = new URLSearchParams(location.search).get("embed") === "1";
  if (embedded) {
    ["back-draft", "pick-shot", "pick-product"].forEach((id) => { const node = $(id); if (node) node.hidden = false; });
    $("back-draft").addEventListener("click", () => parent.postMessage({ type: "pms:back" }, "*"));
    $("pick-shot").addEventListener("click", () => parent.postMessage({ type: "pms:request-asset", kind: "screenshot" }, "*"));
    $("pick-product").addEventListener("click", () => parent.postMessage({ type: "pms:request-asset", kind: "product" }, "*"));
    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type === "pms:load") applyEditorState(data.state);
      if (data.type === "pms:insert") {
        els.md.value = els.md.value.replace(/\s*$/, "") + "\n\n" + data.markdown + "\n";
        render();
      }
      if (data.type === "pms:exported") {
        const a = document.createElement("a");
        a.href = data.href;
        a.download = data.name || "xhs-cards.zip";
        a.click();
        els.status.textContent = "已下载 " + a.download;
      }
      if (data.type === "pms:export-fallback") {
        if (data.index == null) downloadZip.__browser();
        else downloadOne.__browser(data.index);
      }
    });
    parent.postMessage({ type: "pms:ready" }, "*");
  } else {
    load();
    render();
  }
  downloadZip.__browser = async function () { downloadZip.__force = true; try { await downloadZip(); } finally { downloadZip.__force = false; } };
  downloadOne.__browser = async function (i) { downloadOne.__force = true; try { await downloadOne(i); } finally { downloadOne.__force = false; } };
})();

</script>
</body>
</html>
