<!doctype html>
<html lang="zh-CN" data-studio-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>改稿台 · 真实版式 WYSIWYG 原型</title>
<style>
  :root {
    --bg: #f4f2ec;
    --panel: #faf9f5;
    --paper: #ffffff;
    --ink: #1e211d;
    --muted: #6f756d;
    --faint: #9a9f96;
    --line: #e5e2d8;
    --line-strong: #d4d0c2;
    --hover: #efece2;
    --accent: #2c5b45;
    --accent-soft: #e4ece5;
    --gold: #b78b3e;
    --workspace: #e9e6dc;
    --shadow: 0 22px 55px rgba(38, 36, 28, .16);
    --sans: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    --serif: "Iowan Old Style", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
    --bar: 56px;
    color-scheme: light;
  }
  html[data-studio-theme="dark"] {
    --bg: #131613;
    --panel: #191c19;
    --paper: #1f231f;
    --ink: #ece9df;
    --muted: #a2a79e;
    --faint: #7d837a;
    --line: #2c302c;
    --line-strong: #3a3f3a;
    --hover: #232823;
    --accent: #b7cdb8;
    --accent-soft: #26342a;
    --gold: #d3b276;
    --workspace: #0f1210;
    --shadow: 0 26px 60px rgba(0, 0, 0, .42);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; }
  button { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  .appbar {
    height: var(--bar);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 88%, var(--panel));
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .brand {
    display: inline-flex;
    align-items: baseline;
    gap: 9px;
    color: var(--ink);
    text-decoration: none;
    font-family: var(--serif);
    font-size: 18px;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .brand small {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .crumb {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .crumb b {
    color: var(--ink);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .crumb .slash { color: var(--faint); }
  .appbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .save-state { font-size: 12px; color: var(--muted); white-space: nowrap; margin-right: 4px; }
  .btn {
    height: 30px;
    padding: 0 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.icon { width: 30px; padding: 0; }
  .btn.primary {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  .btn.primary:hover { opacity: .88; background: var(--ink); }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); }
  .settings-btn { display: inline-flex; }

  .workbench {
    display: grid;
    grid-template-columns: 88px minmax(0, 1fr) 300px;
    height: calc(100vh - var(--bar));
    min-height: 0;
  }

  .rail {
    min-height: 0;
    overflow: auto;
    padding: 15px 10px 20px;
    border-right: 1px solid var(--line);
    background: var(--bg);
    scrollbar-width: thin;
  }
  .rail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 2px 10px;
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rail-head b { font-weight: 500; color: var(--ink); letter-spacing: 0; }
  .thumb {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 5px;
    padding: 0;
    margin: 0 0 10px;
    border: 0;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .thumb-paper {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    padding: 8px 7px;
    background: var(--thumb-paper, #f5f6f0);
    color: var(--thumb-ink, #1e5a43);
    border: 1px solid var(--line-strong);
    box-shadow: 0 4px 12px rgba(30, 30, 20, .06);
    overflow: hidden;
  }
  .thumb-paper em {
    display: block;
    font-style: normal;
    font-size: 7px;
    letter-spacing: .08em;
    opacity: .62;
  }
  .thumb-paper b {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 7px;
    font-family: var(--serif);
    font-size: 8.5px;
    line-height: 1.42;
    font-weight: 500;
  }
  .thumb-paper i {
    position: absolute;
    left: 7px;
    bottom: 6px;
    font-style: normal;
    font-size: 6.5px;
    letter-spacing: .08em;
    opacity: .55;
  }
  .thumb.is-on .thumb-paper {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .thumb.is-on .thumb-paper::after {
    content: "";
    position: absolute;
    right: 5px;
    top: 5px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
  }
  .rail-add {
    width: 100%;
    height: 28px;
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
  }
  .rail-add:hover { color: var(--ink); border-color: var(--ink); }

  .stage-wrap {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--workspace);
    position: relative;
  }
  .stage-toolbar {
    flex: none;
    height: 42px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 80%, var(--workspace));
    color: var(--muted);
    font-size: 11px;
  }
  .stage-toolbar .zoom {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg);
  }
  .stage-toolbar .zoom button {
    width: 24px;
    height: 24px;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .stage-toolbar .zoom button:hover { background: var(--hover); color: var(--ink); }
  .stage-toolbar .zoom span {
    min-width: 38px;
    text-align: center;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  .stage-toolbar .hint { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage-toolbar .hint b { font-weight: 500; color: var(--ink); }
  .stage-toolbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; white-space: nowrap; }

  .stage {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 22px 22px 40px;
    scrollbar-gutter: stable;
  }
  .page-shell {
    flex: none;
    position: relative;
    background: #fff;
    box-shadow: var(--shadow);
    transition: width .22s cubic-bezier(.2, .7, .2, 1), height .22s cubic-bezier(.2, .7, .2, 1);
  }
  .page-frame {
    width: 1080px;
    height: 1440px;
    display: block;
    border: 0;
    background: #fff;
    transform-origin: top left;
    transition: transform .22s cubic-bezier(.2, .7, .2, 1);
  }
  .page-shell.is-editing { box-shadow: 0 26px 70px rgba(38, 36, 28, .24); }
  .page-shell.is-editing::after {
    content: "编辑中 · Esc 完成";
    position: absolute;
    left: 12px;
    top: -25px;
    color: var(--ink);
    background: var(--gold);
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 10px;
    letter-spacing: .06em;
    white-space: nowrap;
  }

  .panel {
    min-height: 0;
    overflow: auto;
    padding: 18px 16px 42px;
    border-left: 1px solid var(--line);
    background: var(--panel);
    scrollbar-width: thin;
  }
  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .panel-head .kicker { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .panel-head h2 { margin: 4px 0 0; font-family: var(--serif); font-size: 20px; font-weight: 500; letter-spacing: .02em; }
  .panel-close { display: none; }
  .panel-sec { padding: 15px 0; border-top: 1px solid var(--line); }
  .panel-sec:first-of-type { border-top: 0; padding-top: 0; }
  .panel-sec h3 {
    margin: 0 0 11px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field { display: block; margin-bottom: 10px; font-size: 11px; color: var(--muted); }
  .field > span { display: block; margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%;
    height: 31px;
    padding: 0 9px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    font-size: 12px;
    outline: none;
  }
  .field textarea { height: auto; min-height: 110px; padding: 8px 9px; resize: vertical; line-height: 1.6; font-family: var(--sans); }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .color-field {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 31px;
    padding: 0 7px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--bg);
  }
  .color-field input[type="color"] {
    width: 20px;
    height: 20px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  .color-field span { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo-row { display: flex; align-items: center; gap: 9px; margin-top: 4px; }
  .logo-preview { width: 34px; height: 34px; object-fit: contain; border: 1px solid var(--line); background: #fff; }
  .logo-row .btn { height: 27px; padding: 0 8px; font-size: 11px; }
  .check { display: flex; align-items: center; gap: 7px; margin: 9px 0 0; font-size: 11px; color: var(--muted); }
  .check input { accent-color: var(--accent); }
  .panel-note { margin: 9px 0 0; font-size: 11px; line-height: 1.55; color: var(--faint); }
  .panel-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 4px; }
  .panel-actions .btn { flex: 1; }
  .danger { color: #a44433 !important; border-color: color-mix(in srgb, #a44433 34%, var(--line)) !important; }
  .page-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; font-size: 11px; color: var(--muted); }
  .page-meta b { font-weight: 500; color: var(--ink); }
  details { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 2px; }
  details summary { cursor: pointer; font-size: 11px; color: var(--muted); user-select: none; }
  details summary:hover { color: var(--ink); }
  details[open] summary { margin-bottom: 9px; }
  .row { display: flex; gap: 7px; margin-top: 7px; }
  .row .btn { flex: 1; }

  .backdrop {
    position: fixed;
    inset: var(--bar) 0 0;
    background: rgba(10, 12, 10, .38);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    z-index: 45;
  }
  .backdrop.is-open { opacity: 1; pointer-events: auto; }

  .fmt-toolbar, .img-toolbar {
    position: fixed;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    color: #f3f1e7;
    background: #1c1f1c;
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 9px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
  }
  .fmt-toolbar button, .img-toolbar button {
    height: 27px;
    min-width: 28px;
    padding: 0 8px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #f3f1e7;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .fmt-toolbar button:hover, .img-toolbar button:hover { background: rgba(255, 255, 255, .12); }
  .fmt-toolbar button b { font-size: 13px; }
  .fmt-toolbar .mark-swatch {
    display: inline-block;
    min-width: 17px;
    padding: 0 2px;
    color: #1e211d;
    background: #f2e2a0;
    border-radius: 3px;
    font-size: 11px;
    line-height: 15px;
    text-align: center;
  }
  .fmt-toolbar .sep, .img-toolbar .sep { width: 1px; height: 17px; margin: 0 3px; background: rgba(255, 255, 255, .16); }

  .crop-pop {
    position: fixed;
    z-index: 61;
    width: 236px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    box-shadow: 0 18px 42px rgba(0, 0, 0, .22);
    color: var(--ink);
  }
  .crop-pop h4 { margin: 0 0 9px; font-size: 11px; font-weight: 600; letter-spacing: .06em; }
  .crop-row { display: grid; grid-template-columns: 38px 1fr 34px; align-items: center; gap: 7px; margin: 7px 0; font-size: 10px; color: var(--muted); }
  .crop-row input[type="range"] { width: 100%; accent-color: var(--accent); }
  .crop-row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .crop-actions { display: flex; gap: 6px; margin-top: 10px; }
  .crop-actions .btn { flex: 1; height: 27px; font-size: 11px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(6px);
    z-index: 80;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: min(92vw, 580px);
    padding: 9px 12px;
    border-radius: 8px;
    background: #1c1f1c;
    color: #f3f1e7;
    box-shadow: 0 14px 38px rgba(0, 0, 0, .26);
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .toast.is-on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .toast button {
    border: 0;
    background: transparent;
    color: #f2d28a;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
  }

  .stage::-webkit-scrollbar { width: 11px; height: 11px; }
  .stage::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 28%, transparent); border: 3px solid transparent; background-clip: padding-box; border-radius: 10px; }
  .rail::-webkit-scrollbar, .panel::-webkit-scrollbar { width: 9px; }
  .rail::-webkit-scrollbar-thumb, .panel::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 24%, transparent); border: 2px solid transparent; background-clip: padding-box; border-radius: 9px; }

  @media (max-width: 1100px) {
    .workbench { grid-template-columns: 80px minmax(0, 1fr); }
    .settings-btn { display: inline-flex; }
    .panel {
      position: fixed;
      top: var(--bar);
      right: 0;
      bottom: 0;
      width: 360px;
      max-width: 92vw;
      z-index: 50;
      transform: translateX(102%);
      transition: transform .2s cubic-bezier(.2, .7, .2, 1);
      box-shadow: -24px 0 60px rgba(0, 0, 0, .22);
    }
    .panel.is-open { transform: none; }
    .panel-close { display: inline-flex; }
    .backdrop { display: block; }
  }

  @media (max-width: 720px) {
    :root { --bar: 64px; }
    .appbar { gap: 10px; padding: 0 12px; }
    .brand small { display: none; }
    .crumb { display: none; }
    .save-state { display: none; }
    .appbar-actions { gap: 5px; }
    .settings-btn span { display: none; }
    .workbench { display: flex; flex-direction: column; height: calc(100vh - var(--bar)); }
    .stage-wrap { order: 1; flex: 1; min-height: 0; }
    .rail {
      order: 2;
      flex: none;
      height: 86px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 7px 10px;
      border-right: 0;
      border-top: 1px solid var(--line);
    }
    .rail-head { display: none; }
    #thumbs { display: flex; align-items: center; gap: 8px; height: 100%; }
    .thumb { flex: none; width: 52px; margin: 0; }
    .thumb-paper { padding: 5px 4px; }
    .thumb-paper em { font-size: 6px; }
    .thumb-paper b { margin-top: 4px; font-size: 7px; -webkit-line-clamp: 3; }
    .thumb-paper i { display: none; }
    .rail-add { flex: none; width: 42px; height: 64px; font-size: 10px; }
    .stage-toolbar { height: 38px; padding: 0 10px; }
    .stage-toolbar .hint { display: none; }
    .stage-toolbar .right { margin-left: 0; }
    .stage { padding: 10px 8px 24px; }
    .page-shell.is-editing::after { left: 6px; top: -22px; }
    .panel { top: var(--bar); width: 100%; max-width: none; }
    .stage-toolbar .right { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header class="appbar">
  <a class="brand" href="studio-paper.html" title="返回工作室原型">纸 <small>个人媒体工作室</small></a>
  <div class="crumb"><span>改稿台</span><span class="slash">/</span><b id="crumbTitle">为什么我们总是把“休息”当成奖励？</b></div>
  <div class="appbar-actions">
    <span class="save-state" id="saveState">已保存 · 23:40</span>
    <button class="btn icon" id="themeBtn" type="button" aria-label="切换工作室主题" title="切换工作室主题">
      <svg class="i-moon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8 5.6 5.6 0 1 0 13.2 9.6Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <svg class="i-sun" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="display:none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.5v1.4M8 13.1v1.4M1.5 8h1.4M13.1 8h1.4M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
    <button class="btn settings-btn" id="settingsBtn" type="button"><span>品牌与版式</span><span aria-hidden="true">⌘</span></button>
    <button class="btn primary" id="exportBtn" type="button">导出</button>
  </div>
</header>

<main class="workbench">
  <aside class="rail" aria-label="页面缩略图">
    <div class="rail-head"><span>页面</span><b id="pageCount">4</b></div>
    <div id="thumbs"></div>
    <button class="rail-add" id="addPage" type="button">+ 新页</button>
  </aside>

  <section class="stage-wrap" aria-label="页面画布">
    <div class="stage-toolbar">
      <div class="zoom" aria-label="画布缩放">
        <button id="zoomOut" type="button" aria-label="缩小">−</button>
        <span id="zoomLabel">46%</span>
        <button id="zoomIn" type="button" aria-label="放大">+</button>
      </div>
      <div class="hint"><b>点文字直接改</b> · 选中文字可加粗 / 高亮 · 点图片可替换 / 裁切</div>
      <div class="right"><span id="editHint">编辑时自动放大</span></div>
    </div>
    <div class="stage" id="stage">
      <div class="page-shell" id="pageShell">
        <iframe class="page-frame" id="pageFrame" title="1080×1440 页面" scrolling="no"></iframe>
      </div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="品牌与版式">
    <div class="panel-head">
      <div><div class="kicker">Console</div><h2>品牌与版式</h2></div>
      <button class="btn icon panel-close" id="closePanel" type="button" aria-label="关闭">×</button>
    </div>

  function pageDocument(page) {

  function renderFrame() {

  function renderThumbs() {
    var host = $("#thumbs");

  function applyScale() {
    var stage = $("#stage");
    var frame = $("#pageFrame");
    if (!stage || !frame) return;
    var fitW = (stage.clientWidth - 44) / PAGE_W;
    var fitH = (stage.clientHeight - 62) / PAGE_H;
    var fit = Math.min(fitW, fitH, 0.62);
    if (!isFinite(fit) || fit <= 0) fit = 0.3;
    var target = state.zoomMode === "edit" && state.autoZoom ? Math.min(fit * 1.18, 0.62) : fit;
    target = Math.max(0.18, Math.min(0.9, target + state.zoomBias));
    state.scale = target;
    var shell = $("#pageShell");
    shell.style.width = Math.round(PAGE_W * target) + "px";
    shell.style.height = Math.round(PAGE_H * target) + "px";
    frame.style.transform = "scale(" + target + ")";
    $("#zoomLabel").textContent = Math.round(target * 100) + "%";
    $("#editHint").textContent = state.zoomMode === "edit" ? "编辑中 · 自动放大" : "编辑时自动放大";

  function commitFrameNow() {
    var win = $("#pageFrame").contentWindow;
    if (win && typeof win.__pmsCommit === "function") {
      var data = win.__pmsCommit();
      if (data) {
        applyCommit(data);
        state.editing = null;
        state.zoomMode = "fit";
        window.setTimeout(applyScale, 170);
        hideFloating();
      }
    }
  }

  function setPage(index) {
    if (index < 0 || index >= state.pages.length) return;
    commitFrameNow();
    if (state.editing) state.editing = null;
    hideFloating();
    state.pageIndex = index;
    state.zoomMode = "fit";
    state.zoomBias = 0;
    renderFrame();
    applyScale();
    requestAnimationFrame(function () { $("#stage").scrollTop = 0; });
  }

  function markSaving() {
    var el = $("#saveState");
    el.textContent = "保存中…";

      el.textContent = "已保存 · " + nowLabel();

  }

  function toast(message, actionLabel, action) {
    var el = $("#toast");
    el.innerHTML = "";
    var span = document.createElement("span");
    span.textContent = message;
    el.appendChild(span);
    if (actionLabel) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = actionLabel;
      btn.addEventListener("click", function () { hideToast(); if (action) action(); });

    clearTimeout(toast.timer);
    toast.timer = setTimeout(hideToast, 3600);

  function hideToast() { $("#toast").classList.remove("is-on"); }

  function hideFloating() {

    $("#imgToolbar").hidden = true;
    $("#cropPop").hidden = true;

    state.imageBlock = null;
  }

  function placeFloating(el, rect) {
    var frame = $("#pageFrame");
    var r = frame.getBoundingClientRect();
    var s = state.scale;
    el.hidden = false;
    var w = el.offsetWidth || 120;
    var h = el.offsetHeight || 34;
    var x = r.left + rect.x * s;
    var y = r.top + rect.y * s;
    var left = Math.min(window.innerWidth - w - 8, Math.max(8, x));
    var top = Math.max(8, y - h - 9);
    if (y - h - 9 < 8) top = Math.min(window.innerHeight - h - 8, y + rect.h * s + 9);

    el.style.top = top + "px";

  function showFormatToolbar(rect) {
    var el = $("#fmtToolbar");
    state.imageBlock = null;
    $("#imgToolbar").hidden = true;
    placeFloating(el, rect);
  }

  function showImageToolbar(blockId, rect) {

    state.selection = null;
    $("#fmtToolbar").hidden = true;
    placeFloating($("#imgToolbar"), rect);
  }

  function withBlock(blockId) {
    var page = currentPage();
    if (!page || !page.blocks) return null;
    return page.blocks.find(function (b) { return b.id === blockId; }) || null;
  }

  function serializeSpansFromHtml(html) {
    var doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html");

        return;

      if (!(node instanceof HTMLElement)) return;
      var tag = node.tagName;
      var style = node.style || {};

      var nextHighlight = highlight || tag === "MARK" || (bg && bg !== "transparent" && bg !== "rgba(0, 0, 0, 0)");
      Array.prototype.forEach.call(node.childNodes, function (child) { walk(child, nextBold, nextHighlight); });

    walk(root, false, false);
    return spans.length ? spans : [{ text: root.textContent || "" }];

  function applyCommit(data) {
    if (!data) return;
    var page = currentPage();
    if (data.pageId) {
      state.pages.some(function (p) {
        if (p.id === data.pageId) { page = p; return true; }
        return false;
      });
    }
    if (data.field === "brand" && data.brandKey) {
      state.brand[data.brandKey] = data.text;
      syncBrandInputs();
      markSaving();
      return;
    }
    if (data.field === "title") { page.title = data.text; $("#crumbTitle").textContent = state.pages[0].title; setTimeout(renderThumbs, 0); markSaving(); return; }
    if (data.field === "kicker") { page.kicker = data.text; markSaving(); return; }
    if (data.field === "coverSub") { page.coverSub = data.text; markSaving(); return; }
    if (data.field === "coverLead") { page.coverLead = data.text; markSaving(); return; }
    if (data.field === "block" && data.blockId) {
      var block = withBlock(data.blockId);
      if (!block) return;
      block.text = data.text;
      block.spans = serializeSpansFromHtml(data.html || esc(data.text || ""));

      syncMarkdown();
      return;

    if (data.field === "caption" && data.blockId) {

      if (image) { image.caption = data.text; markSaving(); syncMarkdown(); }
    }
  }

  function onFrameMessage(event) {
    var data = event.data;
    if (!data || data.__pms !== true) return;
    if (event.source !== $("#pageFrame").contentWindow) return;
    if (data.type === "edit-start") {
      state.editing = data;
      state.zoomMode = "edit";
      applyScale();
      $("#fmtToolbar").hidden = true;
      $("#imgToolbar").hidden = true;
      return;
    }
    if (data.type === "commit") {
      applyCommit(data);
      state.editing = null;
      state.zoomMode = "fit";
      window.setTimeout(applyScale, 170);
      $("#fmtToolbar").hidden = true;
      return;
    }
    if (data.type === "selection") {
      if (data.field !== "block") { $("#fmtToolbar").hidden = true; return; }
      state.selection = data;
      showFormatToolbar(data.rect);
      return;
    }
    if (data.type === "selection-clear") { $("#fmtToolbar").hidden = true; return; }
    if (data.type === "format-done") { applyCommit(data); markSaving(); return; }
    if (data.type === "image-select") {
      state.zoomMode = "fit";
      applyScale();
      showImageToolbar(data.blockId, data.rect);
      return;
    }
    if (data.type === "ready") {
      sendBrandToFrame();
    }
  }

  function sendBrandToFrame() {
    var frame = $("#pageFrame");
    if (!frame.contentWindow) return;

  }

  function applyThemePreset(theme) {
    var preset = THEMES[theme];
    if (!preset) return;
    state.brand.paper = preset.paper;
    state.brand.ink = preset.ink;
    state.brand.accent = preset.accent;
    state.brand.soft = preset.soft;

  function setTheme(theme) {
    if (!THEMES[theme] || theme === state.theme) return;

  function syncMarkdown() {
    var page = currentPage();
    var lines = [];
    lines.push("# " + page.title);
    if (page.kicker) lines.push(page.kicker);
    if (page.role === "cover") {
      if (page.coverSub) lines.push("", page.coverSub);
      if (page.coverLead) lines.push("", "> " + page.coverLead);
    }
    (page.blocks || []).forEach(function (block) {
      if (block.type === "quote") lines.push("", "> " + spanText(block.spans, block.text));
      else if (block.type === "image") lines.push("", "![" + (block.caption || "图片") + "](" + (state.images[block.assetId] ? "asset:" + block.assetId : "") + ")");
      else lines.push("", spanText(block.spans, block.text));
    });
    $("#mdSource").value = lines.join("\n");
  }

  function parseMarkdown(text) {
    var lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
    var page = currentPage();
    var blocks = [];
    var paragraph = [];
    var title = page.title;
    var kicker = page.kicker;
    var coverSub = page.coverSub;
    var coverLead = page.coverLead;
    var seq = 0;
    function flush() {
      if (!paragraph.length) return;
      blocks.push({ id: "m" + Date.now() + "-" + (seq++), type: "paragraph", text: paragraph.join(" ").trim() });
      paragraph = [];
    }
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line) { flush(); return; }
      if (line.indexOf("# ") === 0) { title = line.slice(2).trim(); return; }
      if (line.indexOf("> ") === 0) { flush(); blocks.push({ id: "m" + Date.now() + "-" + (seq++), type: "quote", text: line.slice(2).trim() }); return; }
      var image = line.match(/^!\[(.*?)\]\((.*?)\)$/);
      if (image) {
        flush();
        var assetId = "md" + Date.now() + "-" + (seq++);
        if (image[2] && image[2].indexOf("asset:") === 0) assetId = image[2].slice(6);
        blocks.push({ id: "m" + Date.now() + "-" + (seq++), type: "image", assetId: assetId, caption: image[1] || "", crop: { x: 50, y: 50, scale: 1 } });
        return;
      }
      paragraph.push(line);
    });
    flush();
    if (page.role === "cover") {
      var first = blocks.find(function (b) { return b.type === "paragraph"; });
      coverSub = first ? first.text : coverSub;
      var firstQuote = blocks.find(function (b) { return b.type === "quote"; });
      if (firstQuote) coverLead = firstQuote.text;
    }
    page.title = title;
    page.kicker = kicker;
    page.coverSub = coverSub;
    page.coverLead = coverLead;
    page.blocks = page.role === "cover" ? [] : blocks;
    renderFrame();
    applyScale();
    markSaving();
    toast("已从 Markdown 更新当前页");
  }

  function addPage() {
    var n = state.pages.length + 1;
    state.pages.push({
      id: "p" + Date.now(),
      role: "content",
      kicker: "0" + n + " · 新页",
      title: "新的一页",
      blocks: [{ id: "b" + Date.now(), type: "paragraph", text: "从这里开始写。" }]
    });
    setPage(state.pages.length - 1);
    markSaving();
    toast("已新建第 " + state.pages.length + " 页");
  }

  function deletePage() {
    if (state.pages.length <= 1) { toast("至少保留一页"); return; }
    var index = state.pageIndex;
    var removed = state.pages[index];
    if (!window.confirm("删除第 " + (index + 1) + " 页？原型里可以撤销。")) return;
    state.pages.splice(index, 1);
    state.pageIndex = Math.min(index, state.pages.length - 1);
    renderFrame();
    applyScale();
    markSaving();
    toast("已删除「" + (removed.title || "这一页") + "」", "撤销", function () {
      state.pages.splice(index, 0, removed);
      state.pageIndex = index;
      renderFrame();
      applyScale();
      markSaving();
    });
  }

  function insertImageFromFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var assetId = "img" + Date.now();
      state.images[assetId] = String(reader.result || "");
      var page = currentPage();
      if (!page.blocks) page.blocks = [];
      page.blocks.push({ id: "b" + Date.now(), type: "image", assetId: assetId, caption: "图片说明", crop: { x: 50, y: 50, scale: 1 } });
      renderFrame();
      applyScale();
      markSaving();
      if (state.theme === "gongwen") toast("图片已插入；公文模板不显示图片，切到其他模板可看到");
      else toast("已插入图片");
    };
    reader.readAsDataURL(file);
  }

  function replaceImageFromFile(file) {
    if (!file || !state.replaceBlockId) return;
    var blockId = state.replaceBlockId;
    var reader = new FileReader();
    reader.onload = function () {
      var block = withBlock(blockId);
      if (!block) return;
      var assetId = "img" + Date.now();
      state.images[assetId] = String(reader.result || "");
      block.assetId = assetId;
      renderFrame();
      applyScale();
      markSaving();
      state.replaceBlockId = null;
      toast("已替换图片");
    };
    reader.readAsDataURL(file);
  }

    });
    $("#autoZoom").addEventListener("change", function (event) {
      state.autoZoom = event.target.checked;
      if (!state.autoZoom && state.zoomMode === "edit") { state.zoomMode = "fit"; applyScale(); }
      if (state.autoZoom && state.editing) { state.zoomMode = "edit"; applyScale(); }
      markSaving();
    });

    $("#insertImage").addEventListener("click", function () {
      $("#imageFile").click();
    });
    $("#imageFile").addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      if (file) insertImageFromFile(file);
      event.target.value = "";
      $("#imgToolbar").hidden = true;
    });

    $("#exportBtn").addEventListener("click", function () {
      markSaving();
      toast("已导出 " + state.pages.length + " 页 · 1080×1440（原型演示）");
    });

    $$("#fmtToolbar [data-fmt]").forEach(function (btn) {
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
      btn.addEventListener("click", function () {
        var frame = $("#pageFrame");
        if (!frame.contentWindow) return;
        frame.contentWindow.postMessage({ __pmsParent: true, type: "format", command: btn.getAttribute("data-fmt"), color: state.brand.soft }, "*");
      });
    });

    $$("#imgToolbar [data-img]").forEach(function (btn) {
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
      btn.addEventListener("click", function () {
        var action = btn.getAttribute("data-img");
        var blockId = state.imageBlock;
        if (!blockId) return;
        if (action === "replace") {
          state.replaceBlockId = blockId;
          $("#imageFile").click();
        } else if (action === "crop") {
          openCrop(blockId);
        } else if (action === "caption") {
          $("#imgToolbar").hidden = true;
          $("#pageFrame").contentWindow.postMessage({ __pmsParent: true, type: "edit-caption", blockId: blockId }, "*");
        } else if (action === "delete") {
          removeBlock(blockId);
        }
      });
    });

    ["cropX", "cropY", "cropScale"].forEach(function (id) {
      $("#" + id).addEventListener("input", applyCropFromInputs);
    });
    $("#cropDone").addEventListener("click", function () { $("#cropPop").hidden = true; state.cropBlockId = null; });

    $("#stage").addEventListener("scroll", function () {
      $("#fmtToolbar").hidden = true;
      $("#imgToolbar").hidden = true;
      $("#cropPop").hidden = true;
    }, { passive: true });

    document.addEventListener("pointerdown", function (event) {
      if (!state.editing) return;
      if (event.target.closest("#fmtToolbar") || event.target.closest("#imgToolbar") || event.target.closest("#cropPop")) return;
      if (event.target === $("#pageFrame") || $("#pageFrame").contains(event.target)) return;
      var win = $("#pageFrame").contentWindow;
      if (win && typeof win.__pmsCommit === "function") commitFrameNow();
      else if (win) win.postMessage({ __pmsParent: true, type: "commit-current" }, "*");
    }, true);

    document.addEventListener("mousedown", function (event) {
      if (!event.target.closest("#fmtToolbar") && !event.target.closest("#imgToolbar") && !event.target.closest("#cropPop") && !event.target.closest(".panel")) {
        $("#fmtToolbar").hidden = true;
        $("#imgToolbar").hidden = true;
        $("#cropPop").hidden = true;
      }
    });

    $("#mdApply").addEventListener("click", function () { parseMarkdown($("#mdSource").value); });
    $("#mdCopy").addEventListener("click", function () {
      var value = $("#mdSource").value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(function () { toast("Markdown 已复制"); }, function () { toast("复制失败"); });
      } else {
        var area = document.createElement("textarea");
        area.value = value;
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); toast("Markdown 已复制"); } catch (e) { toast("复制失败"); }
        area.remove();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closePanel();
        hideFloating();
      }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        markSaving();
        toast("已保存到本地演示");
      }
    });

    window.addEventListener("message", onFrameMessage);
    window.addEventListener("resize", function () { applyScale(); });
    window.addEventListener("beforeunload", function () {});
  }

  function openCrop(blockId) {
    var block = withBlock(blockId);
    if (!block) return;
    state.cropBlockId = blockId;
    var crop = block.crop || { x: 50, y: 50, scale: 1 };
    $("#cropX").value = crop.x;
    $("#cropY").value = crop.y;
    $("#cropScale").value = crop.scale;
    $("#cropXOut").textContent = crop.x;
    $("#cropYOut").textContent = crop.y;
    $("#cropScaleOut").textContent = Number(crop.scale).toFixed(1) + "×";
    $("#imgToolbar").hidden = true;
    var frame = $("#pageFrame");
    var img = frame.contentDocument && frame.contentDocument.querySelector('[data-pms-image="' + blockId + '"]');
    var rect = img ? img.getBoundingClientRect() : { left: frame.getBoundingClientRect().left + 40, top: frame.getBoundingClientRect().top + 40, width: 240, height: 180 };
    placeFloating($("#cropPop"), { x: rect.left, y: rect.top, w: rect.width, h: rect.height });
  }

  function applyCropFromInputs() {
    if (!state.cropBlockId) return;
    var block = withBlock(state.cropBlockId);
    if (!block) return;
    var crop = {
      x: Number($("#cropX").value),
      y: Number($("#cropY").value),
      scale: Number($("#cropScale").value)
    };
    block.crop = crop;
    $("#cropXOut").textContent = crop.x;
    $("#cropYOut").textContent = crop.y;
    $("#cropScaleOut").textContent = crop.scale.toFixed(1) + "×";
    var frame = $("#pageFrame");
    if (frame.contentWindow) frame.contentWindow.postMessage({ __pmsParent: true, type: "apply-crop", blockId: state.cropBlockId, crop: crop }, "*");
    markSaving();
  }

  function removeBlock(blockId) {
    var page = currentPage();
    var index = (page.blocks || []).findIndex(function (b) { return b.id === blockId; });
    if (index < 0) return;
    var removed = page.blocks.splice(index, 1)[0];
    $("#imgToolbar").hidden = true;
    renderFrame();
    applyScale();
    markSaving();
    toast("已删除图片", "撤销", function () {
      page.blocks.splice(index, 0, removed);
      renderFrame();
      applyScale();
      markSaving();
    });
  }

  // init
  try {
    var savedTheme = localStorage.getItem("pms-wysiwyg-theme");
    if (savedTheme === "dark") {
      state.studioTheme = "dark";
      document.documentElement.setAttribute("data-studio-theme", "dark");
      $(".i-moon").style.display = "none";
      $(".i-sun").style.display = "";
    }
  } catch (e) {}
  syncBrandInputs();
  bind();
  renderFrame();
  applyScale();
  $("#saveState").textContent = "已保存 · " + nowLabel();
  window.__pms = { state: state, setPage: setPage, applyCommit: applyCommit, renderFrame: renderFrame };
})();
</script>
</body>
</html>
